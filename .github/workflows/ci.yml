name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU gettext for addon catalogs
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,media]'
      - name: Record Python test environment
        run: |
          cat /etc/os-release
          python -VV
          python -m pip freeze
          msgfmt --version
      - run: pytest
      - run: ruff check .
      - run: python build_addon.py

  windows:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU gettext
        run: choco install gettext --version=1.0.0.20260310 --yes --no-progress
      - name: Add GNU gettext to PATH
        shell: pwsh
        run: |
          $msgfmt = Get-ChildItem "$env:ProgramFiles\gettext-iconv" -Filter msgfmt.exe -File -Recurse | Select-Object -First 1
          if (-not $msgfmt) { throw "msgfmt.exe was not installed" }
          $msgfmt.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $env:PATH = "$($msgfmt.DirectoryName);$env:PATH"
          & $msgfmt.FullName --version
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python --version
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,media]"
      - name: Record Windows test environment
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber | Format-List
          python -VV
          python -m pip freeze
          msgfmt --version
      - run: pytest
      - run: ruff check .
      - run: python build_addon.py

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU gettext for addon catalogs
        run: |
          brew install gettext
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,media]'
      - name: Record macOS test environment
        run: |
          sw_vers
          uname -m
          python -VV
          python -m pip freeze
          msgfmt --version
      - run: pytest
      - run: ruff check .
      - run: python build_addon.py

  gramps-integration:
    name: Gramps integration (${{ matrix.gramps_version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        gramps_version: ["6.0.7", "6.0.8"]
    steps:
      - uses: actions/checkout@v4
      - name: Install native Gramps dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi python3-gi-cairo gir1.2-gtk-3.0 gettext
          /usr/bin/python3 -m venv --system-site-packages .venv-gramps
          .venv-gramps/bin/python -m pip install "gramps==${{ matrix.gramps_version }}"
          .venv-gramps/bin/python -m pip install 'mistune>=3,<4' 'Pillow>=10' 'pypdfium2>=4'
      - name: Record Gramps integration environment
        run: |
          cat /etc/os-release
          .venv-gramps/bin/python -VV
          .venv-gramps/bin/python -m pip freeze
      - name: Create wrapper for the pinned LuaLaTeX image
        run: |
          mkdir -p "$RUNNER_TEMP/lualatex-bin"
          cat > "$RUNNER_TEMP/lualatex-bin/lualatex" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/work" \
            --workdir /work \
            --entrypoint lualatex \
            texlive/texlive:latest@sha256:1cb66a6dc31fe153369c5bb63549aea31c2ffb351613af67b182d84c8521fe89 \
            "$@"
          EOF
          chmod +x "$RUNNER_TEMP/lualatex-bin/lualatex"
      - run: .venv-gramps/bin/python build_addon.py
      - name: Verify native archive installation and reinstallation
        run: >-
          .venv-gramps/bin/python scripts/verify_addon_installer.py
          --addon-archive gramps60/download/GrampsFancyBook.addon.tgz
          --output-record "$RUNNER_TEMP/native-installer-${{ matrix.gramps_version }}.json"
      - name: Verify native Gramps export including PDF
        run: >-
          .venv-gramps/bin/python scripts/verify_gramps.py
          --gramps "$PWD/.venv-gramps/bin/gramps"
          --pdf-output "$GITHUB_WORKSPACE/.work/gramps-integration-${{ matrix.gramps_version }}.pdf"
          --lualatex "$RUNNER_TEMP/lualatex-bin/lualatex"
      - uses: actions/upload-artifact@v4
        with:
          name: GrampsFancyBook-addon-Gramps-${{ matrix.gramps_version }}
          path: gramps60/download/GrampsFancyBook.addon.tgz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GrampsFancyBook-installer-Gramps-${{ matrix.gramps_version }}
          path: ${{ runner.temp }}/native-installer-${{ matrix.gramps_version }}.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GrampsFancyBook-PDF-Gramps-${{ matrix.gramps_version }}
          path: .work/gramps-integration-${{ matrix.gramps_version }}.pdf
          if-no-files-found: ignore
          retention-days: 14

  gramps-prerelease:
    name: Gramps prerelease canary (6.1.0-beta2)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install native Gramps dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi python3-gi-cairo gir1.2-gtk-3.0 gettext
          /usr/bin/python3 -m venv --system-site-packages .venv-gramps-prerelease
          .venv-gramps-prerelease/bin/python -m pip install \
            "gramps @ git+https://github.com/gramps-project/gramps.git@2153e4fa4b0e4ddf7542f1c064c7820bc345a482"
          .venv-gramps-prerelease/bin/python -m pip install 'mistune>=3,<4' 'Pillow>=10' 'pypdfium2>=4'
      - name: Record Gramps prerelease environment
        run: |
          cat /etc/os-release
          .venv-gramps-prerelease/bin/python -VV
          .venv-gramps-prerelease/bin/python -m pip freeze
      - name: Retarget the disposable add-on for the 6.1 API probe
        run: |
          .venv-gramps-prerelease/bin/python - <<'PY'
          from pathlib import Path

          manifest = Path("gramps60/GrampsFancyBook/GrampsFancyBook.gpr.py")
          text = manifest.read_text(encoding="utf-8")
          old = 'gramps_target_version="6.0"'
          if text.count(old) != 1:
              raise SystemExit("Expected one stable 6.0 target in the add-on manifest.")
          manifest.write_text(
              text.replace(old, 'gramps_target_version="6.1"', 1),
              encoding="utf-8",
          )
          PY
      - run: .venv-gramps-prerelease/bin/python build_addon.py
      - run: .venv-gramps-prerelease/bin/python scripts/verify_gramps.py --gramps "$PWD/.venv-gramps-prerelease/bin/gramps"

  latex-prototype:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the renderer note parser
        run: python -m pip install 'mistune>=3,<4' 'pypdf==6.19.0'
      - name: Install PDF text extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
      - name: Render a synthetic book with the production renderer
        env:
          PYTHONPATH: src
          LATEX_RENDERED_BOOK_OUTPUT: ${{ github.workspace }}/.work/latex-spike/rendered-book.tex
          LATEX_FRENCH_BOOK_OUTPUT: ${{ github.workspace }}/.work/latex-spike/rendered-french-book.tex
          LATEX_SPARSE_BOOK_OUTPUT: ${{ github.workspace }}/.work/latex-spike/rendered-sparse-book.tex
        run: python prototypes/build_rendered_book.py
      - name: Compile layout and rendered books with pinned LuaLaTeX
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            texlive/texlive:latest@sha256:1cb66a6dc31fe153369c5bb63549aea31c2ffb351613af67b182d84c8521fe89 \
            bash scripts/compile_latex_prototype.sh
      - name: Verify English tagged document structure and metadata
        run: python scripts/verify_tagged_latex_pdf.py .work/latex-spike/rendered-book.pdf --language en
      - name: Verify French tagged list structure and labels
        run: python scripts/verify_tagged_latex_pdf.py .work/latex-spike/rendered-french-book.pdf
      - name: Audit link ownership and destinations in both books
        run: |
          python scripts/verify_pdf_link_audit.py .work/latex-spike/rendered-book.pdf --negative-controls
          python scripts/verify_pdf_link_audit.py .work/latex-spike/rendered-french-book.pdf
      - name: Verify recorded figure geometry in both books
        run: |
          python scripts/verify_pdf_figure_geometry.py .work/latex-spike/rendered-book.pdf --negative-controls > .work/latex-spike/figure-geometry-en.json
          python scripts/verify_pdf_figure_geometry.py .work/latex-spike/rendered-french-book.pdf > .work/latex-spike/figure-geometry-fr.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install pinned veraPDF in the runner temporary directory
        run: |
          curl --fail --location --retry 3 https://software.verapdf.org/releases/1.30/verapdf-greenfield-1.30.3-installer.zip -o "$RUNNER_TEMP/verapdf.zip"
          echo "b512bf24945503a33fc10738ecffc1f2dccaaf8593a448e94ee9ac86a9559a59  $RUNNER_TEMP/verapdf.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/verapdf.zip" -d "$RUNNER_TEMP/verapdf-package"
          python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree.ElementTree import Element, SubElement, ElementTree
          directory = Path(os.environ["RUNNER_TEMP"])
          root = Element("AutomatedInstallation", langpack="eng")
          SubElement(root, "com.izforge.izpack.panels.htmlhello.HTMLHelloPanel", id="welcome")
          target = SubElement(root, "com.izforge.izpack.panels.target.TargetPanel", id="install_dir")
          SubElement(target, "installpath").text = str(directory / "verapdf")
          packs = SubElement(root, "com.izforge.izpack.panels.packs.PacksPanel", id="sdk_pack_select")
          # Component indices match veraPDF-apps v1.30.3/auto-install-tmp.xml.
          for index, name, selected in [(0, "veraPDF GUI", "true"), (1, "veraPDF CLI", "true"), (2, "veraPDF Documentation", "false"), (3, "veraPDF Sample Plugins", "false")]:
              SubElement(packs, "pack", index=str(index), name=name, selected=selected)
          SubElement(root, "com.izforge.izpack.panels.install.InstallPanel", id="install")
          SubElement(root, "com.izforge.izpack.panels.finish.FinishPanel", id="finish")
          ElementTree(root).write(directory / "verapdf-install.xml", encoding="utf-8")
          PY
          java -jar "$RUNNER_TEMP/verapdf-package/verapdf-greenfield-1.30.3/verapdf-izpack-installer-1.30.3.jar" "$RUNNER_TEMP/verapdf-install.xml"
          "$RUNNER_TEMP/verapdf/verapdf" --version
      - name: Audit UA-2 automatic requirements with the documented metadata exception
        run: |
          gfb_ua2_status=0
          python scripts/verify_pdf_ua2.py .work/latex-spike/rendered-book.pdf --verapdf "$RUNNER_TEMP/verapdf/verapdf" --report-directory .work/latex-spike/ua2-en --allow-missing-identification --negative-controls || gfb_ua2_status=1
          python scripts/verify_pdf_ua2.py .work/latex-spike/rendered-french-book.pdf --verapdf "$RUNNER_TEMP/verapdf/verapdf" --report-directory .work/latex-spike/ua2-fr --allow-missing-identification || gfb_ua2_status=1
          python scripts/verify_pdf_ua2.py .work/latex-spike/rendered-sparse-book.pdf --verapdf "$RUNNER_TEMP/verapdf/verapdf" --report-directory .work/latex-spike/ua2-sparse --allow-missing-identification || gfb_ua2_status=1
          exit "$gfb_ua2_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lualatex-book-fixtures
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            .work/latex-spike/figure-geometry-*.json
            .work/latex-spike/ua2-*/**/*.xml
            .work/latex-spike/ua2-*/**/*.json
            .work/latex-spike/ua2-*/**/*.log
            .work/latex-spike/layout-spike.pdf
            .work/latex-spike/layout-spike.tex
            .work/latex-spike/layout-spike.log
            .work/latex-spike/rendered-book.pdf
            .work/latex-spike/rendered-book.tex
            .work/latex-spike/rendered-book.log
            .work/latex-spike/rendered-french-book.pdf
            .work/latex-spike/rendered-french-book.tex
            .work/latex-spike/rendered-french-book.log
            .work/latex-spike/rendered-sparse-book.pdf
            .work/latex-spike/rendered-sparse-book.tex
            .work/latex-spike/rendered-sparse-book.log
            .work/latex-spike/media/*.png
          retention-days: 14
