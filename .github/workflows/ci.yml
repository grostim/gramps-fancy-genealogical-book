name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU gettext for addon catalogs
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,media]'
      - name: Record Python test environment
        run: |
          cat /etc/os-release
          python -VV
          python -m pip freeze
          msgfmt --version
      - run: pytest
      - run: ruff check .
      - run: python build_addon.py

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU gettext
        run: choco install gettext --version=1.0.0.20260310 --yes --no-progress
      - name: Add GNU gettext to PATH
        shell: pwsh
        run: |
          $msgfmt = Get-ChildItem "$env:ProgramFiles\gettext-iconv" -Filter msgfmt.exe -File -Recurse | Select-Object -First 1
          if (-not $msgfmt) { throw "msgfmt.exe was not installed" }
          $msgfmt.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $env:PATH = "$($msgfmt.DirectoryName);$env:PATH"
          & $msgfmt.FullName --version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python --version
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,media]"
      - name: Record Windows test environment
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber | Format-List
          python -VV
          python -m pip freeze
          msgfmt --version
      - run: pytest
      - run: ruff check .
      - run: python build_addon.py

  gramps-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native Gramps dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi python3-gi-cairo gir1.2-gtk-3.0 gettext
          /usr/bin/python3 -m venv --system-site-packages .venv-gramps
          .venv-gramps/bin/python -m pip install 'gramps==6.0.8'
          .venv-gramps/bin/python -m pip install 'mistune>=3,<4' 'Pillow>=10' 'pypdfium2>=4'
      - name: Record Gramps integration environment
        run: |
          cat /etc/os-release
          .venv-gramps/bin/python -VV
          .venv-gramps/bin/python -m pip freeze
      - run: .venv-gramps/bin/python build_addon.py
      - run: .venv-gramps/bin/python scripts/verify_gramps.py --gramps "$PWD/.venv-gramps/bin/gramps"
      - uses: actions/upload-artifact@v4
        with:
          name: GrampsFancyBook-addon
          path: gramps60/download/GrampsFancyBook.addon.tgz

  latex-prototype:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the renderer note parser
        run: python -m pip install 'mistune>=3,<4' 'pypdf==6.19.0'
      - name: Install PDF text extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
      - name: Render a synthetic book with the production renderer
        env:
          PYTHONPATH: src
          LATEX_RENDERED_BOOK_OUTPUT: ${{ github.workspace }}/.work/latex-spike/rendered-book.tex
          LATEX_FRENCH_BOOK_OUTPUT: ${{ github.workspace }}/.work/latex-spike/rendered-french-book.tex
          LATEX_SPARSE_BOOK_OUTPUT: ${{ github.workspace }}/.work/latex-spike/rendered-sparse-book.tex
        run: python prototypes/build_rendered_book.py
      - name: Compile layout and rendered books with pinned LuaLaTeX
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            texlive/texlive:latest@sha256:1cb66a6dc31fe153369c5bb63549aea31c2ffb351613af67b182d84c8521fe89 \
            bash scripts/compile_latex_prototype.sh
      - name: Verify French tagged list structure and labels
        run: python scripts/verify_tagged_latex_pdf.py .work/latex-spike/rendered-french-book.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: lualatex-book-fixtures
          path: |
            .work/latex-spike/layout-spike.pdf
            .work/latex-spike/layout-spike.tex
            .work/latex-spike/layout-spike.log
            .work/latex-spike/rendered-book.pdf
            .work/latex-spike/rendered-book.tex
            .work/latex-spike/rendered-book.log
            .work/latex-spike/rendered-french-book.pdf
            .work/latex-spike/rendered-french-book.tex
            .work/latex-spike/rendered-french-book.log
            .work/latex-spike/rendered-sparse-book.pdf
            .work/latex-spike/rendered-sparse-book.tex
            .work/latex-spike/rendered-sparse-book.log
            .work/latex-spike/media/*.png
          if-no-files-found: error
          retention-days: 14
